name: Package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional helper test dependencies
        run: python -m pip install numpy matplotlib Pillow PyMuPDF python-pptx 'jsonschema>=4,<5'
      - name: Verify helper test dependencies are importable
        run: python -c "import numpy, matplotlib, PIL, pymupdf, pptx, jsonschema"
      - run: npm run validate
      - run: npm run build
      - run: npm run validate
      - run: npm test
      - name: Test Python helpers
        run: python -X utf8 -B -m unittest discover -s tests/python
      - name: Test release ZIP construction and source retention
        run: python -X utf8 -B tests/test_package_release.py
      - run: npm pack --ignore-scripts --pack-destination .
      - name: Check offline installation from the actual package tarball
        env:
          ARA_DRAFT_TARBALL: academic-research-assistant-3.1.0.tgz
        run: python -B tests/test_draft_artifact.py
