name: Improvement request
description: Propose a focused improvement to the local research assistant.
title: "[Improvement]: "
body:
  - type: markdown
    attributes:
      value: |
        This public collection includes third-party materials with separate terms. Do not attach source materials unless you have permission to share them. A catalog entry or local check does not prove an external service connection or completed research.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the task that is difficult today and a concrete example.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the observable result and any relevant skill or command.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How could a reviewer determine that this improvement works?
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and alternatives
      description: Note required host tools, optional runtimes, services, source permissions, and alternatives considered. Do not include credentials.
